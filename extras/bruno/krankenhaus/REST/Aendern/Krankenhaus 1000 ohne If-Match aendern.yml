info:
  name: Krankenhaus 1000 ohne If-Match aendern
  type: http
  seq: 2

http:
  method: PUT
  url: "{{restUrl}}/:id"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: id
      value: "{{vorhandeneId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Staedtisches Klinikum Karlsruhe",
        "mitarbeiteranzahl": 4200,
        "bettenanzahl": 1500,
        "email": "info@klinikum-karlsruhe.example"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "428"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/problem\+json(; charset=utf-8)?$

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
