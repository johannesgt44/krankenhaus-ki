info:
  name: Falsche ID xyz
  type: http
  seq: 3

http:
  method: GET
  url: "{{restUrl}}/:id"
  headers:
    - name: Accept
      value: application/problem+json
  params:
    - name: id
      value: xyz
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/problem\+json(; charset=utf-8)?$

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
