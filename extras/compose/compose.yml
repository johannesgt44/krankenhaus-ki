services:
  db:
    image: dhi.io/postgres:18.3-debian13
    ports:
      - published: 5432
        target: 5432
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: p
    volumes:
      - pg_data_krankenhaus_ki:/var/lib/postgresql/18/data
    healthcheck:
      test: ["CMD", "pg_isready", "--dbname=postgres", "--username=postgres"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  keycloak:
    image: dhi.io/keycloak:26.6.1-debian13
    command: ["start-dev", "--hostname-strict=false"]
    user: "65532:65532"
    ports:
      - published: 8880
        target: 8080
    environment:
      TZ: Europe/Berlin
      KC_BOOTSTRAP_ADMIN_USERNAME: tmp
      KC_BOOTSTRAP_ADMIN_PASSWORD: p
    volumes:
      - kc_data:/opt/keycloak/data

volumes:
  pg_data_krankenhaus_ki:
  kc_data:
    external: true
